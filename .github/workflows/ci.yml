name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint e formatacao
        run: |
          ruff check .
          ruff format --check .
      - name: Testes
        run: pytest